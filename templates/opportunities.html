<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0A2E22" />
<title>Opportunities — eKasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="topbar">
  <a href="/" class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2 L30 16 L16 30 L2 16 Z" />
      <circle cx="16" cy="16" r="3.2" />
    </svg>
    <span class="brand-name">eKasi</span>
  </a>
  <span class="page-tag">Opportunities</span>
</header>

<main class="container">

  <section class="page-head">
    <p class="eyebrow">Live feed</p>
    <h1>Opportunity Hub</h1>
    <p class="lede">
      Government tenders, youth learnerships, jobs, and funding —
      updated daily. Filtered for real access.
    </p>
  </section>

  <section class="filters">
    <select id="fProvince" aria-label="Province">
      <option value="All">All Provinces</option>
      <option>Gauteng</option>
      <option>KwaZulu-Natal</option>
      <option>Western Cape</option>
      <option>Eastern Cape</option>
      <option>Free State</option>
      <option>Limpopo</option>
      <option>Mpumalanga</option>
      <option>North West</option>
      <option>Northern Cape</option>
      <option>National</option>
    </select>
    <select id="fType" aria-label="Type">
      <option value="All">All Types</option>
      <option value="tender">Tenders</option>
      <option value="job">Jobs</option>
      <option value="learnership">Learnerships</option>
      <option value="funding">Funding</option>
    </select>
    <label class="check">
      <input type="checkbox" id="fYouth" />
      <span>Youth set-aside only</span>
    </label>
  </section>

  <section id="oppList" class="opp-list">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </section>

  <p class="muted center" id="emptyMsg" hidden>
    No opportunities match your filters yet. Check back soon.
  </p>

</main>

<nav class="bottom-nav">
  <a href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M3 11 L12 3 L21 11" />
      <path d="M5 10 V20 H19 V10" />
    </svg>
    <span>Home</span>
  </a>
  <a href="/tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M6 3 h9 l4 4 v14 a1 1 0 0 1-1 1 H6 a1 1 0 0 1-1-1 V4 a1 1 0 0 1 1-1Z" />
      <polyline points="14 3 14 8 19 8" />
    </svg>
    <span>Tools</span>
  </a>
  <a href="/opportunities" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="9" />
      <circle cx="12" cy="12" r="4" />
      <circle cx="12" cy="12" r="1" />
    </svg>
    <span>Opps</span>
  </a>
</nav>

<script src="/static/js/opportunities.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
