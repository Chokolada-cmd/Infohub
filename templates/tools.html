<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0A2E22" />
<title>PDF Tools — eKasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="topbar">
  <a href="/" class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2 L30 16 L16 30 L2 16 Z" />
      <circle cx="16" cy="16" r="3.2" />
    </svg>
    <span class="brand-name">eKasi</span>
  </a>
  <span class="page-tag">PDF Tools</span>
</header>

<main class="container">

  <section class="page-head">
    <p class="eyebrow">Document workspace</p>
    <h1>PDF Toolkit</h1>
    <p class="lede">
      Every tool runs inside your browser. Nothing is uploaded for editing.
      Private, fast, and data-light.
    </p>
  </section>

  <section class="tool-grid">
    <button class="tool" data-tool="merge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="10" height="14" rx="1.5" />
        <rect x="11" y="6" width="10" height="14" rx="1.5" />
      </svg>
      <span>Merge</span>
    </button>
    <button class="tool" data-tool="split">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4" y="3" width="16" height="18" rx="1.5" />
        <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="2 2" />
      </svg>
      <span>Split</span>
    </button>
    <button class="tool" data-tool="rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 12 a8 8 0 1 1-3-6.2" />
        <polyline points="20 4 20 9 15 9" />
      </svg>
      <span>Rotate</span>
    </button>
    <button class="tool" data-tool="create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 3 h9 l4 4 v14 a1 1 0 0 1-1 1 H6 a1 1 0 0 1-1-1 V4 a1 1 0 0 1 1-1Z" />
        <line x1="12" y1="11" x2="12" y2="17" />
        <line x1="9" y1="14" x2="15" y2="14" />
      </svg>
      <span>Create</span>
    </button>
    <button class="tool" data-tool="secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4" y="10" width="16" height="10" rx="2" />
        <path d="M8 10 V7 a4 4 0 0 1 8 0 v3" />
      </svg>
      <span>Secure</span>
    </button>
    <button class="tool" data-tool="unlock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4" y="10" width="16" height="10" rx="2" />
        <path d="M8 10 V7 a4 4 0 0 1 7-2.5" />
      </svg>
      <span>Unlock</span>
    </button>
    <button class="tool" data-tool="sign">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 20 c3 0 4-12 8-12 s4 6 7 6 c1.5 0 2-.8 3-2" />
      </svg>
      <span>Sign</span>
    </button>
    <button class="tool" data-tool="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 8V6a2 2 0 0 1 2-2h2" />
        <path d="M16 4h2a2 2 0 0 1 2 2v2" />
        <path d="M20 16v2a2 2 0 0 1-2 2h-2" />
        <path d="M8 20H6a2 2 0 0 1-2-2v-2" />
        <circle cx="12" cy="12" r="3.2" />
      </svg>
      <span>Scan</span>
    </button>
    <button class="tool" data-tool="word">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 3 h9 l4 4 v14 a1 1 0 0 1-1 1 H6 a1 1 0 0 1-1-1 V4 a1 1 0 0 1 1-1Z" />
        <path d="M9 12 l1.5 6 1.5-4 1.5 4 1.5-6" />
      </svg>
      <span>To Word</span>
    </button>
  </section>

  <section class="workspace" id="workspace">
    <div class="ws-header">
      <h2 id="wsTitle">Select a tool to begin</h2>
      <button class="btn btn-ghost" id="wsClose" hidden>Close</button>
    </div>
    <div id="wsBody" class="ws-body">
      <p class="muted">
        Choose any tool above. Your documents never leave this device for editing tasks.
      </p>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <a href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M3 11 L12 3 L21 11" />
      <path d="M5 10 V20 H19 V10" />
    </svg>
    <span>Home</span>
  </a>
  <a href="/tools" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M6 3 h9 l4 4 v14 a1 1 0 0 1-1 1 H6 a1 1 0 0 1-1-1 V4 a1 1 0 0 1 1-1Z" />
      <polyline points="14 3 14 8 19 8" />
    </svg>
    <span>Tools</span>
  </a>
  <a href="/opportunities">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="9" />
      <circle cx="12" cy="12" r="4" />
      <circle cx="12" cy="12" r="1" />
    </svg>
    <span>Opps</span>
  </a>
</nav>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="/static/js/tools.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
